<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas</title>
    <link rel="stylesheet" href="css/main.css">

</head>

<body>
    <header>
        <div class="header">
            <p>Calculadora de Notas</p>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">
                <svg class="icon icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M6 .278a.75.75 0 0 1 .08.858A6.5 6.5 0 1 0 14.864 10.92a.75.75 0 0 1 .858.08A7.5 7.5 0 1 1 6 .278" />
                </svg>
                <svg class="icon icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8z" />
                    <path d="M8 0a.75.75 0 0 1 .75.75v1.1a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0z" />
                    <path d="M8 14.15a.75.75 0 0 1 .75.75V16a.75.75 0 0 1-1.5 0v-1.1a.75.75 0 0 1 .75-.75z" />
                    <path d="M16 8a.75.75 0 0 1-.75.75h-1.1a.75.75 0 0 1 0-1.5h1.1A.75.75 0 0 1 16 8z" />
                    <path d="M1.85 8a.75.75 0 0 1-.75.75H0a.75.75 0 0 1 0-1.5h1.1a.75.75 0 0 1 .75.75z" />
                    <path d="M13.657 2.343a.75.75 0 0 1 0 1.06l-.778.778a.75.75 0 0 1-1.06-1.06l.778-.778a.75.75 0 0 1 1.06 0z" />
                    <path d="M4.242 11.757a.75.75 0 0 1 0 1.06l-.778.778a.75.75 0 0 1-1.06-1.06l.778-.778a.75.75 0 0 1 1.06 0z" />
                    <path d="M13.657 13.657a.75.75 0 0 1-1.06 0l-.778-.778a.75.75 0 1 1 1.06-1.06l.778.778a.75.75 0 0 1 0 1.06z" />
                    <path d="M4.242 4.242a.75.75 0 0 1-1.06 0l-.778-.778a.75.75 0 1 1 1.06-1.06l.778.778a.75.75 0 0 1 0 1.06z" />
                </svg>
            </button>
        </div>
    </header>
    <main>
        <div class="nota-container">
        <button class="btn btn-volver" id="btn-volver">Volver</button>
        <p id="curso"></p>
            <div class="nota-row">
                <label for="continua1">Continua 1</label>
                <div class="input-group">
                    <input type="number" id="continua1" name="continua1" min="0" max="20" placeholder="nota">
                    <div>
                        <input type="number" id="peso-continua1" name="peso-continua1" min="0" max="100" placeholder="peso">
                        <span>%</span>
                    </div>
                </div>
            </div>
            <div class="nota-row">
                <label for="examen1">Examen 1</label>
                <div class="input-group">
                    <input type="number" id="examen1" name="examen1" min="0" max="20" placeholder="nota">
                    <div>
                        <input type="number" id="peso-examen1" name="peso-examen1" min="0" max="100" placeholder="peso">
                        <span>%</span>
                    </div>
                </div>
            </div>
            <hr>
            <div class="nota-row">
                <label for="continua2">Continua 2</label>
                <div class="input-group">
                    <input type="number" id="continua2" name="continua2" min="0" max="20" placeholder="nota">
                    <div>
                        <input type="number" id="peso-continua2" name="peso-continua2" min="0" max="100" placeholder="peso">
                        <span>%</span>
                    </div>
                </div>
            </div>
            <div class="nota-row">
                <label for="examen2">Examen 2</label>
                <div class="input-group">
                    <input type="number" id="examen2" name="examen2" min="0" max="20" placeholder="nota">
                    <div>
                        <input type="number" id="peso-examen2" name="peso-examen2" min="0" max="100" placeholder="peso">
                        <span>%</span>
                    </div>
                </div>
            </div>
            <hr>
            <div class="nota-row">
                <label for="continua3">Continua 3</label>
                <div class="input-group">
                    <input type="number" id="continua3" name="continua3" min="0" max="20" placeholder="nota">
                    <div>
                        <input type="number" id="peso-continua3" name="peso-continua3" min="0" max="100" placeholder="peso">
                        <span>%</span>
                    </div>
                </div>
            </div>
            <div class="nota-row">
                <label for="examen3">Examen 3</label>
                <div class="input-group">
                    <input type="number" id="examen3" name="examen3" min="0" max="20" placeholder="nota">
                    <div>
                        <input type="number" id="peso-examen3" name="peso-examen3" min="0" max="100" placeholder="peso">
                        <span>%</span>
                    </div>
                </div>
            </div>
            <hr>
            <div class="nota-row">
                <label for="nota-minima">Nota Minima Aprobatoria</label>
                <div class="input-group">
                    <select name="nota-minima" id="nota-minima">
                        <option selected value="10.5">10.5</option>
                        <option value="11.0">11.0</option>
                    </select>
                </div>
            </div>
            <hr>
            <input type="submit" id="calcular" value="Calcular" class="btn">

            <p class="nota-final" id="nota-final"></p>
            <p class="nota-faltante" id="nota-faltante"></p>

        </div>

        
    </main>
    <script src="js/theme.js"></script>
    <script src="js/calculadora.js"></script>

</body>

</html>
